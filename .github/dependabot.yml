version: 2
updates:
  - package-ecosystem: "nuget"
    directories:
      - "/src/PageSharp"
      - "/tests/PageSharp.Tests"
      - "/samples/PageSharp.Sample"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
