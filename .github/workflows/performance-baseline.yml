name: Site generation comparison

# Called only after the ordinary build and unit-test jobs succeed.
on:
  workflow_call:
    inputs:
      baseline:
        description: Full baseline SHA; empty or all-zero uses the first parent
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      BASELINE_SHA: ${{ inputs.baseline }}
    steps:
      - name: Checkout candidate and history
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup fixed SDK and runtime
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.403

      - name: Compare representative site generation
        run: python3 eng/compare-site-generation.py

      - name: Preserve raw results, output manifests and failures
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: site-generation-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/site-generation-comparison
          retention-days: 14
          if-no-files-found: warn
