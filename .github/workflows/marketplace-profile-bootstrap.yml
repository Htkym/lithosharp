name: marketplace-profile-bootstrap

# Read-only initial authentication check; this workflow never publishes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    if: github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Verify existing marketplace required reviewers
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $policyJson = gh api "repos/$env:GITHUB_REPOSITORY/environments/marketplace"
          if ($LASTEXITCODE -ne 0) { throw 'Configure marketplace with required reviewers before the authentication check.' }
          $policy = $policyJson | ConvertFrom-Json
          $approval = @($policy.protection_rules | Where-Object { $_.type -ceq 'required_reviewers' })
          if ($approval.Count -ne 1 -or @($approval[0].reviewers).Count -eq 0) {
            throw 'The marketplace environment must have at least one required reviewer.'
          }

  profile:
    needs: preflight
    if: github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main'
    runs-on: ubuntu-24.04
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ secrets.MARKETPLACE_AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.MARKETPLACE_AZURE_TENANT_ID }}
      AZURE_CORE_OUTPUT: none
    steps:
      - name: Check Marketplace federation configuration
        shell: pwsh
        run: |
          foreach ($name in @('AZURE_CLIENT_ID', 'AZURE_TENANT_ID')) {
            $value = [Environment]::GetEnvironmentVariable($name)
            $id = [guid]::Empty
            if (![guid]::TryParse($value, [ref]$id) -or $id -eq [guid]::Empty) {
              throw "$name must be configured with a valid Marketplace federation ID."
            }
          }
      - name: Sign in with GitHub OIDC
        uses: azure/login@v3.1.0
        env:
          AZURE_CORE_OUTPUT: json
        with:
          client-id: ${{ secrets.MARKETPLACE_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.MARKETPLACE_AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Read Marketplace profile ID
        shell: pwsh
        run: |
          $profileId = az rest --method get --url https://app.vssps.visualstudio.com/_apis/profile/profiles/me --resource 499b84ac-1321-427f-aa17-267ca6975798 --query id --output tsv
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the authenticated Marketplace profile ID.' }
          $id = [guid]::Empty
          if (![guid]::TryParse(($profileId -join "`n"), [ref]$id) -or $id -eq [guid]::Empty) {
            throw 'Marketplace returned an invalid profile ID.'
          }
          Write-Output $id.ToString()
