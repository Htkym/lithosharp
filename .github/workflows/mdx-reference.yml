name: MDX reference

on:
  workflow_dispatch:
  pull_request:
    paths:
      - tests/fixtures/mdx-baseline/**
      - .github/workflows/mdx-reference.yml
  push:
    branches: [main]
    paths:
      - tests/fixtures/mdx-baseline/**
      - .github/workflows/mdx-reference.yml

permissions:
  contents: read

jobs:
  reference:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tests/fixtures/mdx-baseline
    env:
      NO_UPDATE_NOTIFIER: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.13.0
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm test
