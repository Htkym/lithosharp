name: publish-nuget

on:
  push:
    tags:
      - 'v*'

env:
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  LITHOSHARP_PREVIOUS_STABLE_VERSION: '2.1.3'

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Verify release tag equals current reviewed main
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./eng/Test-MainRelease.ps1 -CiWorkflow build.yml -ReleaseTag $env:GITHUB_REF_NAME -RequireTag

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore LithoSharp.slnx --locked-mode

      - name: Setup MDX toolchain
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.13.0

      - name: Restore and test MDX worker
        working-directory: src/LithoSharp.Mdx/worker
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test

      - name: Build and test
        run: |
          dotnet build LithoSharp.slnx --no-restore --configuration Release
          dotnet test --solution LithoSharp.slnx --no-build --configuration Release

      - name: Pack and validate all release packages
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          ./eng/Test-ReleasePipeline.ps1 -Check CoreTag -Tag $env:GITHUB_REF_NAME
          foreach ($package in (Get-Content eng/release-packages.json -Raw | ConvertFrom-Json)) {
            $id = $package.id
            $project = $package.project
            [xml] $xml = Get-Content -LiteralPath $project -Raw
            if (@($xml.Project.PropertyGroup.Version) -notcontains $version) { throw "$project does not match tag version $version." }
            dotnet pack $project --no-build --no-restore --configuration Release --output artifacts/packages -p:EnablePackageValidation=true
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            ./eng/Validate-Package.ps1 -PackageDirectory artifacts/packages -PackageId $id -ExpectedVersion $version
          }

      - name: Check previous-stable consumer against final packages
        shell: pwsh
        run: |
          $baseline = Join-Path $env:RUNNER_TEMP 'baseline-packages'
          $null = New-Item -ItemType Directory -Force -Path $baseline
          $version = $env:LITHOSHARP_PREVIOUS_STABLE_VERSION
          Invoke-WebRequest "https://api.nuget.org/v3-flatcontainer/lithosharp/$version/lithosharp.$version.nupkg" -OutFile (Join-Path $baseline "LithoSharp.$version.nupkg")
          ./eng/Test-ConsumerCompatibility.ps1 -BaselinePackageDirectory $baseline -CandidatePackageDirectory artifacts/packages -BaselineVersion $version -CandidateVersion ($env:GITHUB_REF_NAME -replace '^v', '')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Preserve validated release packages
        uses: actions/upload-artifact@v7.0.2
        with:
          name: lithosharp-packages-${{ github.ref_name }}
          path: artifacts/packages/*nupkg
          if-no-files-found: error

      - name: Recheck main before publication
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./eng/Test-MainRelease.ps1 -CiWorkflow build.yml -ReleaseTag $env:GITHUB_REF_NAME -RequireTag

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push
        run: >-
          dotnet nuget push "artifacts/packages/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
