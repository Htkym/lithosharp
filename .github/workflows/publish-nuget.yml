name: publish-nuget

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore LithoSharp.slnx --locked-mode

      - name: Setup MDX toolchain
        uses: actions/setup-node@v7
        with:
          node-version: 24.13.0

      - name: Restore and test MDX worker
        working-directory: src/LithoSharp.Mdx/worker
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test

      - name: Build and test
        run: |
          dotnet build LithoSharp.slnx --no-restore --configuration Release
          dotnet test --solution LithoSharp.slnx --no-build --configuration Release

      - name: Pack and validate all release packages
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          foreach ($id in @('LithoSharp', 'LithoSharp.Generators', 'LithoSharp.Images', 'LithoSharp.Tool', 'LithoSharp.Testing', 'LithoSharp.Mdx', 'LithoSharp.ProjectTemplates')) {
            $parent = if ($id -eq 'LithoSharp.ProjectTemplates') { 'templates' } else { 'src' }
            $project = "$parent/$id/$id.csproj"
            [xml] $xml = Get-Content -LiteralPath $project -Raw
            if (@($xml.Project.PropertyGroup.Version) -notcontains $version) { throw "$project does not match tag version $version." }
            dotnet pack $project --no-build --no-restore --configuration Release --output artifacts/packages -p:EnablePackageValidation=true
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            ./eng/Validate-Package.ps1 -PackageDirectory artifacts/packages -PackageId $id -ExpectedVersion $version
          }

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push
        run: >-
          dotnet nuget push "artifacts/packages/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
