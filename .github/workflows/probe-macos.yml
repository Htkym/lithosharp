# TEMPORARY diagnosis for R22 macOS failure (delete after use).
# Probes rename(2) behavior on read-only directories and the exact .NET
# Directory.Move behavior on macos-15. Trigger with:
#   gh workflow run probe-macos --ref verify/r22-os-matrix
name: probe-macos

on:
  workflow_dispatch:
  push:
    branches:
      - verify/r22-os-matrix

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-15
    steps:
      - name: Filesystem facts
        shell: pwsh
        run: |
          uname -a
          stat -f 'fs=%T mount=%m' /Users/runner/work || true
          ls -lO /Users/runner/work | head -3 || true
          python3 -c "import os, tempfile; d = tempfile.mkdtemp(); open(os.path.join(d, 'ABC'), 'w').write('x'); print('case-sensitive:', not os.path.exists(os.path.join(d, 'abc')))"

      - name: Python rename probe on read-only dirs
        run: |
          python3 - <<'EOF'
          import os, errno, shutil, stat
          base = os.path.expanduser('~/work-probe')
          shutil.rmtree(base, ignore_errors=True)
          os.makedirs(base)
          # Case 1: rename r-x dir onto nonexistent destination (the failing scenario).
          src = os.path.join(base, 'output')
          os.mkdir(src)
          open(os.path.join(src, 'old.txt'), 'w').write('old')
          os.chmod(src, 0o500)
          try:
              os.rename(src, os.path.join(base, 'backup'))
              print('case1 rename r-x dir: OK')
          except OSError as e:
              print(f'case1 rename r-x dir: FAIL errno={e.errno} ({errno.errorcode.get(e.errno)}) {e}')
          # Case 2: create a file inside an r-x dir (expected to fail everywhere).
          try:
              open(os.path.join(base, 'backup', 'new.txt'), 'w').write('x')
              print('case2 create inside r-x: OK (unexpected)')
          except OSError as e:
              print(f'case2 create inside r-x: FAIL errno={e.errno} ({errno.errorcode.get(e.errno)}) (expected)')
          # Case 3: stat the mode bits back.
          print('backup mode:', oct(stat.S_IMODE(os.stat(os.path.join(base, 'backup')).st_mode)))
          shutil.rmtree(base, ignore_errors=True)
          EOF

      - name: .NET Directory.Move probe on read-only dirs
        run: |
          rm -rf ~/dotnet-probe && mkdir -p ~/dotnet-probe && cd ~/dotnet-probe
          dotnet new console -o probe --no-restore > /dev/null 2>&1
          cat > probe/Program.cs <<'EOF'
          var baseDir = Path.Combine(Path.GetTempPath(), "dotnet-move-probe");
          if (Directory.Exists(baseDir)) Directory.Delete(baseDir, recursive: true);
          Directory.CreateDirectory(baseDir);
          var src = Path.Combine(baseDir, "output");
          Directory.CreateDirectory(src);
          File.WriteAllText(Path.Combine(src, "old.txt"), "old");
          File.SetUnixFileMode(src, UnixFileMode.UserRead | UnixFileMode.UserExecute);
          try
          {
              Directory.Move(src, Path.Combine(baseDir, "backup"));
              Console.WriteLine("dotnet Move r-x dir: OK");
          }
          catch (Exception ex)
          {
              Console.WriteLine($"dotnet Move r-x dir: FAIL {ex.GetType().FullName}: {ex.Message}");
          }
          EOF
          dotnet run --project probe 2>&1 | tail -5
