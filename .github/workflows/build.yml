name: build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore PageSharp.slnx --locked-mode

      - name: Build
        run: dotnet build PageSharp.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test --solution PageSharp.slnx --no-build --configuration Release --verbosity minimal

      - name: Run sample
        run: dotnet run --project samples/PageSharp.Sample --configuration Release --no-build -- --output artifacts/sample-site

      - name: Upload sample site
        uses: actions/upload-artifact@v7
        with:
          name: sample-site
          path: artifacts/sample-site
