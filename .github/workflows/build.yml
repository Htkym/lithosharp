name: build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore LithoSharp.slnx --locked-mode

      - name: Build
        run: dotnet build LithoSharp.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test --solution LithoSharp.slnx --no-build --configuration Release --verbosity minimal

      - name: Run sample
        run: |
          dotnet run --project samples/LithoSharp.DocsSample --configuration Release --no-build -- --output artifacts/docs-sample-site
          dotnet run --project samples/LithoSharp.Sample --configuration Release --no-build -- --output artifacts/blog-sample-site

      - name: Upload sample site
        uses: actions/upload-artifact@v7
        with:
          name: sample-site
          path: artifacts/sample-site
